name: Release

# Builds main.js from the tagged commit, attests it and publishes a GitHub release with main.js,
# manifest.json and styles.css. Release notes are the matching section of CHANGELOG.md.
# Tag = manifest version without a "v" prefix (Obsidian requires an exact match).
on:
    push:
        tags:
            - '*'
    # Recovery path when a tag push does not trigger the workflow: run from the Actions tab,
    # selecting the tag as the ref. Branch refs are rejected.
    workflow_dispatch:

permissions:
    contents: write
    id-token: write
    attestations: write

jobs:
    release:
        runs-on: ubuntu-latest
        timeout-minutes: 10

        steps:
            - uses: actions/checkout@v5
              with:
                  persist-credentials: false

            - name: Tag must match manifest version
              id: version
              run: |
                  if [ "$GITHUB_REF_TYPE" != "tag" ]; then
                    echo "::error::Run this workflow from a tag ref, not from branch '$GITHUB_REF_NAME'."
                    exit 1
                  fi
                  version="$(jq -r .version manifest.json)"
                  if [ "$GITHUB_REF_NAME" != "$version" ]; then
                    echo "::error::Tag '$GITHUB_REF_NAME' does not match manifest version '$version'. Tag without 'v' and bump via 'pnpm version'."
                    exit 1
                  fi
                  echo "version=$version" >> "$GITHUB_OUTPUT"

            - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
            - uses: actions/setup-node@v5
              with:
                  node-version: 22
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            - run: pnpm build

            - name: Attest build provenance
              uses: actions/attest-build-provenance@v4
              with:
                  subject-path: |
                      main.js
                      manifest.json
                      styles.css

            - name: Release notes from CHANGELOG.md
              env:
                  VERSION: ${{ steps.version.outputs.version }}
              run: |
                  # Section "## [<version>] ..." up to the next "## " heading, without the heading itself.
                  awk -v v="$VERSION" '
                    /^## \[/ { in_section = index($0, "## [" v "]") == 1; next }
                    in_section { print }
                  ' CHANGELOG.md | sed -e :a -e '/^\n*$/{$d;N;ba' -e '}' > release-notes.md
                  if [ ! -s release-notes.md ]; then
                    echo "::warning::No CHANGELOG.md section for $VERSION; using GitHub-generated notes."
                  fi

            - name: Create release
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  VERSION: ${{ steps.version.outputs.version }}
              run: |
                  if [ -s release-notes.md ]; then
                    notes=(--notes-file release-notes.md)
                  else
                    notes=(--generate-notes)
                  fi
                  gh release create "$VERSION" \
                    --title "$VERSION" \
                    --target "$GITHUB_SHA" \
                    "${notes[@]}" \
                    main.js manifest.json styles.css
